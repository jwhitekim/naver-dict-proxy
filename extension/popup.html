<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>My Dict</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <div class="brand"><span class="brand-mark"></span>My Dict</div>
      <form id="search-form">
        <input id="word-input" type="text" placeholder="Search a word…" autocomplete="off" autofocus />
        <button type="submit">Search</button>
      </form>
      <div id="source-picker" class="source-picker">
        <button type="button" class="source-btn active" data-source="">Oxford</button>
        <button type="button" class="source-btn" data-source="동아">동아</button>
        <button type="button" class="source-btn" data-source="YBM">YBM</button>
      </div>
      <div id="result"></div>
    </div>
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
