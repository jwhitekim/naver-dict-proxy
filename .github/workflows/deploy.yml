name: Deploy

on:
  push:
    branches: [main]

env:
  APP_PORT: "9000"

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restart server
        run: docker compose up -d --build

      - name: Health check
        run: |
          sleep 2
          curl -sf http://127.0.0.1:${APP_PORT}/health
