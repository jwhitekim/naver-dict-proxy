name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - name: Restart server
        run: |
          npm run stop || true
          npm run start:bg

      - name: Health check
        run: |
          sleep 2
          curl -sf http://localhost:3001/health
